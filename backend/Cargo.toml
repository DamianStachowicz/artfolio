[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.0"
actix-files = "0.6"
actix-multipart = "0.4"
rocket = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls"] }
dotenv = "0.15"
image = "0.25.5"
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"